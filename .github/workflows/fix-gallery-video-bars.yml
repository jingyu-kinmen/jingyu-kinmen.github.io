name: Fix gallery video card aspect ratio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update gallery video cards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '.card-media{position:relative;aspect-ratio:4/3;background:var(--bg-2);overflow:hidden;cursor:pointer}'
          new_css = old_css + '\n.card-media.gallery-video{aspect-ratio:16/9}'

          if 'card-media.gallery-video' not in text:
              if old_css not in text:
                  raise SystemExit('Expected card-media CSS was not found')
              text = text.replace(old_css, new_css, 1)

          old_html = "'<div class=\"card-media\" data-gal=\"'+idx+'\">'"
          new_html = "'<div class=\"card-media '+(isVid?'gallery-video':'')+'\" data-gal=\"'+idx+'\">'"

          if "class=\"card-media '+(isVid?'gallery-video':'')+'\"" not in text:
              if old_html not in text:
                  raise SystemExit('Expected gallery card markup was not found')
              text = text.replace(old_html, new_html, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix gallery video card aspect ratio"
          git push
