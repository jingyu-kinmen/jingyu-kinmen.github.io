name: Remove placeholders

on:
  push:
    paths:
      - '.github/workflows/remove-placeholders.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/remove_placeholders.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove placeholder gallery cards and products'
          git push
