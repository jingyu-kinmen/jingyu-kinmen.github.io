name: Fix hero rotation

on:
  push:
    paths:
      - 'scripts/fix_hero_rotation.py'
      - '.github/workflows/fix-hero-rotation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hero rotation fix
        run: python3 scripts/fix_hero_rotation.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix homepage video rotation loop'
          git push
