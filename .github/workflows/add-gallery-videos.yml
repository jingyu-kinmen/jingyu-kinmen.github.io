name: Add gallery videos

on:
  push:
    paths:
      - '.github/workflows/add-gallery-videos.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add five videos to gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          videos = [
              ('lKdbZkuoK2Q', '新作影片・08', 'New Film · 08'),
              ('cSQlerEFZM8', '新作影片・09', 'New Film · 09'),
              ('NAD0GfVmNa8', '新作影片・10', 'New Film · 10'),
              ('nC4AqPPIOls', '新作影片・11', 'New Film · 11'),
              ('3GBoOLpQ43s', '新作影片・12', 'New Film · 12'),
          ]

          new_entries = []
          for video_id, zh_title, en_title in videos:
              if f"youtube:'{video_id}'" in text:
                  continue
              new_entries.append(
                  "  {kind:'video', youtube:'%s', src:'', img:'https://i.ytimg.com/vi/%s/maxresdefault.jpg',\n"
                  "   title:{zh:'%s',en:'%s'},\n"
                  "   desc:{zh:'新增至作品集的影像作品。',en:'A newly added film in the gallery.'}},\n"
                  % (video_id, video_id, zh_title, en_title)
              )

          if new_entries:
              marker = "  {kind:'video', youtube:'', src:'', img:'',"
              if marker not in text:
                  raise SystemExit('Gallery insertion point not found')
              text = text.replace(marker, ''.join(new_entries) + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Add five new gallery videos'
          git push
