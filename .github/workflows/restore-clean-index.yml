name: Restore clean index

on:
  push:
    paths:
      - '.github/workflows/restore-clean-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index
        run: git show 7eb8b53f4bdfacdca3857052f9bccbed86b5a5a6:index.html > index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore clean index'
          git push
      - name: Remove workflow
        if: always()
        run: |
          git rm -f .github/workflows/restore-clean-index.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary restore workflow' || true
          git push || true
