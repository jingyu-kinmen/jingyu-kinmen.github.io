name: Run cart and contact update

on:
  push:
    paths:
      - '.github/workflows/run-cart-contact-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update website
        run: python3 scripts/update_cart_contact.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add editable cart and popup contact details'
          git push
