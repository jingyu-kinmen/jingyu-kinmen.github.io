name: Final video fix

on:
  push:
    paths:
      - '.github/workflows/final-video-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace gallery and restore product entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          gallery = r'''const GALLERY = [
  {kind:'video', youtube:'TXJ2a91cp6A', src:'', img:'https://i.ytimg.com/vi/TXJ2a91cp6A/maxresdefault.jpg',
   title:{zh:'千手觀音・金身醒覺',en:'Thousand-Armed Guanyin · Awakening'},
   desc:{zh:'莊嚴的千手觀音金身在寺院香煙與光影之間，呈現寧靜而細微的醒覺意象。',en:'A serene Thousand-Armed Guanyin statue appears subtly awakened amid incense smoke, practical temple light and quiet devotional atmosphere.'}},

  {kind:'video', youtube:'Us73eMT4qUo', src:'', img:'https://i.ytimg.com/vi/Us73eMT4qUo/maxresdefault.jpg',
   title:{zh:'焚香祈福・一縷心香',en:'Offering Incense · A Thread of Prayer'},
   desc:{zh:'一縷香火在燭光中緩緩升起，雙手點燃香枝，記錄祭壇前安靜而虔誠的祈福時刻。',en:'Hands light a single incense stick by candlelight, capturing a quiet and intimate moment of prayer at a household altar.'}},

  {kind:'video', youtube:'nwul-lB8slc', src:'', img:'https://i.ytimg.com/vi/nwul-lB8slc/maxresdefault.jpg',
   title:{zh:'南海觀音・晨露蓮池',en:'Guanyin of the South Sea · Dawn Lotus Pond'},
   desc:{zh:'黎明的蓮池畔，南海觀音持柳枝與淨瓶靜立於薄霧之中，呈現清晨寧靜祥和的氣息。',en:'At first light beside a still lotus pond, Guanyin stands quietly with a willow branch and simple vase amid soft morning mist.'}},

  {kind:'video', youtube:'Nzs4uwpodC4', src:'', img:'https://i.ytimg.com/vi/Nzs4uwpodC4/maxresdefault.jpg',
   title:{zh:'星河織女・銀絲織夢',en:'Celestial Weaver · Dreaming in Silver Threads'},
   desc:{zh:'星河之下，織女以銀絲般的光線編織夢境，宛如在星空中創造一段奇幻的光影故事。',en:'A celestial figure weaves a strand of light beneath a projected galaxy, creating a quiet fantasy scene of starlight and dreams.'}},

  {kind:'video', youtube:'D5IeYHJE6Tw', src:'', img:'https://i.ytimg.com/vi/D5IeYHJE6Tw/maxresdefault.jpg',
   title:{zh:'媽祖鎮海・廟埕觀潮',en:'Mazu Guards the Sea · Watching the Tide'},
   desc:{zh:'臨海古廟中，媽祖端坐守望海面；夕陽、海風與廟宇風鈴交織出溫暖而平靜的海岸景象。',en:'Inside a weathered coastal temple pavilion, Mazu watches the sea as warm late-afternoon light, sea breeze and temple bells fill the scene.'}},

  {kind:'video', youtube:'x5aTL7C3ZJM', src:'', img:'https://i.ytimg.com/vi/x5aTL7C3ZJM/maxresdefault.jpg',
   title:{zh:'星河織女・銀絲織夢',en:'Celestial Weaver · Dreaming in Silver Threads'},
   desc:{zh:'星河之下，織女以銀絲般的光線編織夢境，宛如在星空中創造一段奇幻的光影故事。',en:'A celestial figure weaves a strand of light beneath a projected galaxy, creating a quiet fantasy scene of starlight and dreams.'}},

  {kind:'video', youtube:'kjy2rbjisWo', src:'', img:'https://i.ytimg.com/vi/kjy2rbjisWo/maxresdefault.jpg',
   title:{zh:'竹亭靜修・蓮花禪心',en:'Quiet Meditation in the Bamboo Pavilion · Lotus Zen'},
   desc:{zh:'白衣女子靜坐竹亭，以蓮花入禪；晨光、瀑布與荷花交織出寧靜的庭園修行景象。',en:'A woman meditates in a bamboo pavilion with a lotus, surrounded by morning light, a small waterfall and a quiet garden.'}},

  {kind:'video', youtube:'', src:'', img:'',
   title:{zh:'客棧・房間巡禮',en:'Inn Room Tour'},
   desc:{zh:'夏興客棧每個房間的樣子。',en:'Every room at Xiaxing Inn.'}},

  {kind:'music', src:'', img:'',
   title:{zh:'風獅爺（Demo）',en:'Wind Lion God (Demo)'},
   desc:{zh:'一段給金門寫的東西，還沒混完。',en:'Something written for Kinmen. Not finished mixing.'}},

  {kind:'music', src:'', img:'',
   title:{zh:'夜裡的市民大道',en:'Civic Boulevard at Night'},
   desc:{zh:'加班回家路上錄的。',en:'Recorded walking home from a late shift.'}},

  {kind:'photo', img:'',
   title:{zh:'前水頭・老厝',en:'Qianshuitou Old Houses'},
   desc:{zh:'紅磚、燕尾脊、下午三點的光。',en:'Red brick, swallowtail ridges, three o\'clock light.'}},

  {kind:'photo', img:'',
   title:{zh:'退潮',en:'Low Tide'},
   desc:{zh:'海水退了以後留下的東西。',en:'What the water leaves behind.'}},

  {kind:'photo', img:'',
   title:{zh:'信義路四段',en:'Xinyi Road Sec. 4'},
   desc:{zh:'辦公室樓下，等紅燈的人。',en:'Below the office, waiting for the light.'}},

  {kind:'photo', img:'',
   title:{zh:'客棧的早餐桌',en:'Breakfast at the Inn'},
   desc:{zh:'豆漿、蛋餅、還有一隻不請自來的貓。',en:'Soy milk, egg crepe, and one uninvited cat.'}},

  {kind:'photo', img:'',
   title:{zh:'替代役的下午',en:'Afternoon, Service Year'},
   desc:{zh:'手機、筆電、還有很多時間。',en:'A phone, a laptop, and a lot of time.'}}
];'''

          s,n=re.subn(r'const GALLERY = \[.*?\n\];\n\n/\* ---------------------------------------------------------', gallery+'\n\n/* ---------------------------------------------------------', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('GALLERY section not found')

          product = r'''  {cat:'other', img:'ginger-poster.png', imgs:[], ratio:'1054/1492', price:'洽詢 On request',
   name:{zh:'薑皇王 300 粒',en:'Ukon King · 300 capsules'},
   desc:{zh:'日本甘味人生，六種薑黃複方，一盒 300 粒。',en:'A six-turmeric blend from 甘味人生, Japan. 300 capsules.'},
   facts:{zh:[['內容量','1 盒 300 粒'],['品牌','甘味人生（日本）'],['配方','六種薑黃複方']],
          en:[['Contents','300 capsules'],['Brand','Kanmi Jinsei (Japan)'],['Blend','Six turmeric varieties']]},
   ingr:{zh:'',en:''},
   use:{zh:'',en:''},
   note:{zh:'這是食品，不是藥品。孕婦、膽道疾病或正在服藥的人請先問過醫師。',en:'A food product, not a medicine. If pregnant, managing a bile-duct condition or taking medication, ask your doctor first.'}},'''
          s,n=re.subn(r"  \{cat:'other', img:'ginger-poster\.png'.*?\n\n  /\* 這一項", product+'\n  /* 這一項', s, count=1, flags=re.S)
          if n!=1: raise SystemExit('ginger product entry not found')

          s=s.replace('transform:scale(2.25);transition:.45s','transform:scale(2.35);transition:.45s')
          s=s.replace('transform:scale(2.32)','transform:scale(2.42)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize video metadata and restore product details'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/final-video-fix.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary final video workflow' || true
          git push || true
