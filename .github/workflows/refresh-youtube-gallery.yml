name: Refresh YouTube gallery metadata

on:
  push:
    paths:
      - '.github/workflows/refresh-youtube-gallery.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Update gallery metadata and hero crop
        run: |
          python <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          ids = [
              'TXJ2a91cp6A', 'Us73eMT4qUo', 'nwul-lB8slc',
              'Nzs4uwpodC4', 'D5IeYHJE6Tw', 'x5aTL7C3ZJM', 'kjy2rbjisWo'
          ]

          def js(s):
              s = s or ''
              return s.replace('\\', '\\\\').replace("'", "\\'").replace('\\r', '').replace('\\n', ' ')

          metadata = {}
          for vid in ids:
              url = f'https://www.youtube.com/watch?v={vid}'
              try:
                  raw = subprocess.check_output(
                      ['yt-dlp', '--skip-download', '--no-warnings', '--print-json', url],
                      text=True, stderr=subprocess.DEVNULL, timeout=60
                  )
                  data = json.loads(raw)
                  metadata[vid] = {
                      'title': data.get('title') or vid,
                      'description': data.get('description') or ''
                  }
              except Exception as e:
                  print(f'Could not fetch {vid}: {e}')

          for vid, data in metadata.items():
              pattern = re.compile(
                  r"(\{kind:'video', youtube:'" + re.escape(vid) + r"'.*?title:\{zh:')[^']*('.*?en:')[^']*('.*?desc:\{zh:')[^']*('.*?en:')[^']*('.*?\}\},)",
                  re.S
              )
              def repl(m):
                  return m.group(1) + js(data['title']) + m.group(2) + js(data['title']) + m.group(3) + js(data['description']) + m.group(4) + js(data['description']) + m.group(5)
              text, count = pattern.subn(repl, text, count=1)
              if count == 0:
                  print(f'No gallery entry matched {vid}')

          # The YouTube HQ thumbnail itself contains letterboxing on some videos.
          # Increase the hero crop so the embedded black bands are outside the tile.
          text = text.replace(
              '.hero-video-thumb{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.3);transition:.45s}',
              '.hero-video-thumb{width:100%;height:100%;display:block;object-fit:cover;object-position:center;transform:scale(1.7);transition:.45s}'
          )
          text = text.replace(
              '.hero-video-tile:hover .hero-video-thumb{transform:scale(1.34)}',
              '.hero-video-tile:hover .hero-video-thumb{transform:scale(1.75)}'
          )

          path.write_text(text, encoding='utf-8')
          print('Updated YouTube metadata for:', ', '.join(metadata))
          PY

      - name: Commit website changes and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/refresh-youtube-gallery.yml
          git commit -m "Update YouTube titles descriptions and hero crop" || exit 0
          git push
