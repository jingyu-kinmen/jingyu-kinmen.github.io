name: Upgrade homepage video showcase

on:
  push:
    paths:
      - '.github/workflows/upgrade-hero-showcase.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade hero
        run: python3 scripts/upgrade_hero_showcase.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign hero with sharp rotating video showcase'
          git push
