name: Check new video titles

on:
  push:
    paths:
      - '.github/workflows/check-new-video-titles.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read YouTube oEmbed titles
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          ids = ['NAD0GfVmNa8','7IoZcheLUw8','rc22FcpzpcM','FqFjSzqRnq4','dCbTzPmIK3A','g1SLMWxK-QA']
          for vid in ids:
              url='https://www.youtube.com/oembed?url='+urllib.parse.quote('https://www.youtube.com/watch?v='+vid,safe='')+'&format=json'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.load(r)
                  print(vid+'\t'+data.get('title',''))
              except Exception as e:
                  print(vid+'\tERROR '+repr(e))
          PY
