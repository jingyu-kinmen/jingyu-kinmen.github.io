name: Refine cart and contact

on:
  push:
    paths:
      - '.github/workflows/refine-cart-contact.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine website
        run: python3 scripts/refine_cart_contact.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refine cart trigger and contact details'
          git push
