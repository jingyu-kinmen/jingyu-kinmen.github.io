name: Add six devotional videos

on:
  push:
    paths:
      - '.github/workflows/add-six-devotional-videos.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add videos to gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          items = [
            ('YVu0SunPHkc', '月老牽紅線', 'Yue Lao · The Matchmaker God and the Red Thread',
             '月老坐在溫暖燭光下，翻開姻緣簿並輕握紅線；斑駁木桌、老廟燭火與細微紙張聲，呈現安靜而親密的姻緣祈願時刻。',
             'Yue Lao sits by warm candlelight with an open registry book and a spool of red thread, creating an intimate temple portrait of quiet matchmaking devotion.'),
            ('DqrKIzSybcw', '財神獻寶', 'Cai Shen · Presenting Treasure',
             '財神身著深紅與金色禮服，端坐廟堂並托起一枚金元寶；柔和日光與沉穩色調讓畫面更像真實廟宇紀錄，而非華麗商業廣告。',
             'Cai Shen sits calmly in a temple hall presenting a single gold ingot, framed by soft daylight, muted red-and-gold robes and a restrained documentary atmosphere.'),
            ('jZZH3Tb_6MM', '雙獅鎮境', 'Twin Wind Lion Guardians at Dusk',
             '兩尊風化的石雕風獅爺守在村口，夕陽斜照石面與巷道；風吹動披風、祈福旗與落葉，呈現金門黃昏的守護景象。',
             'Two weathered Wind Lion God statues guard a village gate at dusk as low golden light, fluttering prayer flags and windblown leaves shape the Kinmen streetscape.'),
            ('XzuXoEpnrmg', '竹林緩行', 'A Monk Walking Slowly Through a Bamboo Grove',
             '僧人沿竹林小徑緩步前行，灰色僧袍與竹葉在微風中自然擺動；斑駁日光、腳步聲與竹林聲響形成安靜的行旅片段。',
             'A monk walks slowly through a bamboo grove as dappled daylight, rustling leaves and measured footsteps create a calm observational sequence.'),
            ('lD1LGiUkA0k', '河燈夜放', 'River Lanterns Released at Dusk',
             '黃昏河面上，一盞盞蓮花河燈隨水流緩緩漂動，燭光在深藍水面拉出柔和倒影，留下純粹而安靜的夜色片段。',
             'Lotus-shaped paper lanterns drift across a dark river at dusk, their candlelight reflecting softly on the water in a quiet atmospheric study.'),
            ('mThSP5NCTdg', '老樹祈願', 'An Elderly Woman Praying Beneath a Banyan Tree',
             '老婦人在老榕樹下合掌祈願，斑駁樹影落在身上，身後的小石祠與午後蟬聲構成樸實而真實的日常信仰畫面。',
             'An elderly woman prays beneath an old banyan tree as shifting afternoon light, a small weathered shrine and village ambience create a quiet portrait of daily devotion.'),
          ]

          start = s.find('const GALLERY = [')
          if start < 0:
              raise SystemExit('GALLERY start not found')
          end = s.find('\n\n];', start)
          if end < 0:
              raise SystemExit('GALLERY end not found')

          gallery = s[start:end]
          blocks = []
          for vid, zh, en, dz, de in items:
              if "youtube:'" + vid + "'" in gallery:
                  continue
              blocks.append(
                  "\n  {kind:'video', youtube:'%s', src:'', img:'https://i.ytimg.com/vi/%s/maxresdefault.jpg',\n"
                  "   title:{zh:'%s',en:'%s'},\n"
                  "   desc:{zh:'%s',en:'%s'}},\n" % (vid, vid, zh, en, dz, de)
              )

          if blocks:
              s = s[:end] + ''.join(blocks) + s[end:]

          # Existing total is 17; add six more.
          s = s.replace('<span class="hero-video-count">01 / 17</span>', '<span class="hero-video-count">01 / 23</span>', 1)

          # Verify each new video appears exactly once in GALLERY.
          end2 = s.find('\n\n];', start)
          gal2 = s[start:end2]
          for vid, *_ in items:
              if gal2.count("youtube:'" + vid + "'") != 1:
                  raise SystemExit('Video missing or duplicated: ' + vid)

          p.write_text(s, encoding='utf-8')
          print('Added six new devotional videos.')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add six devotional gallery videos'
          git push
