name: Fix video content

on:
  push:
    paths:
      - '.github/workflows/fix-video-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update video metadata and crop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          items = {
            'TXJ2a91cp6A': ('千手觀音・金身醒覺', 'Thousand-Armed Guanyin · Awakening', '莊嚴的千手觀音金身在寺院香煙與光影之間，呈現寧靜而細微的醒覺意象。', 'A serene Thousand-Armed Guanyin statue appears subtly awakened amid incense smoke, practical temple light and quiet devotional atmosphere.'),
            'kjy2rbjisWo': ('竹亭靜修・蓮花禪心', 'Quiet Meditation in the Bamboo Pavilion · Lotus Zen', '白衣女子靜坐竹亭，以蓮花入禪；晨光、瀑布與荷花交織出寧靜的庭園修行景象。', 'A woman meditates in a bamboo pavilion with a lotus, surrounded by morning light, a small waterfall and a quiet garden.'),
            'x5aTL7C3ZJM': ('星河織女・銀絲織夢', 'Celestial Weaver · Dreaming in Silver Threads', '星河之下，織女以銀絲般的光線編織夢境，宛如在星空中創造一段奇幻的光影故事。', 'A celestial figure weaves a strand of light beneath a projected galaxy, creating a quiet fantasy scene of starlight and dreams.'),
            'Nzs4uwpodC4': ('星河織女・銀絲織夢', 'Celestial Weaver · Dreaming in Silver Threads', '星河之下，織女以銀絲般的光線編織夢境，宛如在星空中創造一段奇幻的光影故事。', 'A celestial figure weaves a strand of light beneath a projected galaxy, creating a quiet fantasy scene of starlight and dreams.'),
            'nwul-lB8slc': ('南海觀音・晨露蓮池', 'Guanyin of the South Sea · Dawn Lotus Pond', '黎明的蓮池畔，南海觀音持柳枝與淨瓶靜立於薄霧之中，呈現清晨寧靜祥和的氣息。', 'At first light beside a still lotus pond, Guanyin stands quietly with a willow branch and simple vase amid soft morning mist.'),
            'D5IeYHJE6Tw': ('媽祖鎮海・廟埕觀潮', 'Mazu Guards the Sea · Watching the Tide', '臨海古廟中，媽祖端坐守望海面；夕陽、海風與廟宇風鈴交織出溫暖而平靜的海岸景象。', 'Inside a weathered coastal temple pavilion, Mazu watches the sea as warm late-afternoon light, sea breeze and temple bells fill the scene.'),
            'Us73eMT4qUo': ('焚香祈福・一縷心香', 'Offering Incense · A Thread of Prayer', '一縷香火在燭光中緩緩升起，雙手點燃香枝，記錄祭壇前安靜而虔誠的祈福時刻。', 'Hands light a single incense stick by candlelight, capturing a quiet and intimate moment of prayer at a household altar.'),
          }

          # Update every matching GALLERY entry without touching other content.
          for vid, (zh, en, dz, de) in items.items():
              pat = re.compile(r"(\{kind:'video', youtube:'" + re.escape(vid) + r"'.*?\n\s*title:\{zh:')[^']*('.*,en:')[^']*('}\s*,\n\s*desc:\{zh:')[^']*('.*,en:')[^']*('}\}),", re.S)
              repl = r"\g<1>" + zh + r"\g<2>" + en + r"\g<3>" + dz + r"\g<4>" + de + r"\g<5>,"
              s, n = pat.subn(repl, s, count=1)
              if n != 1:
                  raise SystemExit(f'Could not update gallery entry {vid}')

          # Use the highest-resolution YouTube thumbnail and crop aggressively enough
          # to remove letterboxing baked into generated thumbnails.
          for vid in items:
              s = s.replace(f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg', f'https://i.ytimg.com/vi/{vid}/maxresdefault.jpg')

          s = s.replace("transform:scale(1.7);transition:.45s", "transform:scale(2.25);transition:.45s")
          s = s.replace("transform:scale(1.75)", "transform:scale(2.32)")

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update individual video titles, descriptions and hero crop'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-video-content.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary video update workflow' || true
          git push || true
