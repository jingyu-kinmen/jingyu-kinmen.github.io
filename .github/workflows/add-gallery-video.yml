name: Add gallery YouTube video
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add YouTube video to gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="{kind:'video', youtube:'', src:'', img:'',\n   title:{zh:'夏興的一天',en:'A Day in Xiaxing'},"
          new="{kind:'video', youtube:'TXJ2a91cp6A', src:'', img:'https://i.ytimg.com/vi/TXJ2a91cp6A/hqdefault.jpg',\n   title:{zh:'夏興的一天',en:'A Day in Xiaxing'},"
          if old in s:
              s=s.replace(old,new,1)
          old2="?rel=0\" allow=\"accelerometer;autoplay;encrypted-media;picture-in-picture\""
          new2="?autoplay=1&playsinline=1&rel=0&modestbranding=1\" allow=\"accelerometer;autoplay;encrypted-media;picture-in-picture\""
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Add YouTube video to gallery"
          git push
          rm -f .github/workflows/add-gallery-video.yml
          git add -A
          git commit -m "Remove one-time gallery update workflow" || true
          git push || true
